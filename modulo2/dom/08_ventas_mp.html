<!DOCTYPE html>
<html lang="es">
<head>

  <title>Gestor de Productos</title>
</head>
<body>

  <h1>Gestor de Inventario de Productos</h1>

  <section id="contenedorProductos"></section>

  <script src="08_ventas_mp.js"></script>
